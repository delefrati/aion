# Transformer medium for TPU v5e-8 on Kaggle
# ~105M params (comparable to mamba_medium) — benefits from TPU's matmul throughput
model_type: transformer
vocab_size: 16384
d_model: 768
n_layers: 12
n_heads: 12
seq_len: 1024
dropout: 0.0  # single-pass pretraining (no repeated data): dropout only slows learning. Chat configs keep 0.1.

dataset_type: text
train_path: ""
val_path: ""
tokenizer_path: ""
instruction_data: ""

# TPU v5e single chip has 16GB HBM — attention scores are [batch*heads, seq, seq];
# Effective batch = batch_size * grad_accum_steps * cores = 8 * 1 * 1 = 8. The '* 8 cores'
# this file was written for never happened (see tpu_cores below), and the budget in
# run_config.py was calibrated against the runs that actually ran, i.e. at 8.
batch_size: 8
grad_accum_steps: 1
tpu_cores: 1  # PINNED SINGLE-CORE, and this is NOT a change in behaviour: tpu_cores was not a
#               TrainConfig field until now, so it was dropped on load and this run has
#               ALWAYS trained on one core (tpu_cores: 8 in this file never took effect). Letting it
#               fan out now would multiply the effective batch by 8 mid-lineage (8 -> 64)
#               at the same LR, and make every step in the budget worth 8x more data. To go
#               multi-core deliberately: divide batch_size by 8 first (-> 1 per core),
#               then re-derive the step budget in run_config.py.
num_workers: 4
lr: 3.0e-4
weight_decay: 0.01
max_steps: 20000
warmup_steps: 500
lr_decay_steps: 20000  # cosine decays over the full target, not per-session max_steps
grad_clip: 1.0
grad_checkpoint: true  # recompute attention in backward — bounds HBM to ~1 layer
compile: false
seed: 42

checkpoint_dir: checkpoints/transformer_tpu_medium
checkpoint_every: 500
eval_every: 500
log_every: 50
max_eval_batches: 20
early_stop_patience: 20
early_stop_min_delta: 0.01
