# Transformer medium for TPU v5e-8 on Kaggle
# ~105M params (comparable to mamba_medium) — benefits from TPU's matmul throughput
model_type: transformer
vocab_size: 16384
d_model: 768
n_layers: 12
n_heads: 12
seq_len: 1024
dropout: 0.1

dataset_type: text
train_path: ""
val_path: ""
tokenizer_path: ""
instruction_data: ""

# TPU v5e single chip has 16GB HBM — attention scores are [batch*heads, seq, seq];
# keep per-step batch small. tpu_cores=8 fans out data-parallel over all cores
# (effective batch = batch_size * grad_accum_steps * cores = 8 * 1 * 8 = 64).
batch_size: 8
grad_accum_steps: 1
tpu_cores: 8
num_workers: 4
lr: 3.0e-4
weight_decay: 0.01
max_steps: 20000
warmup_steps: 500
lr_decay_steps: 20000  # cosine decays over the full target, not per-session max_steps
grad_clip: 1.0
grad_checkpoint: true  # recompute attention in backward — bounds HBM to ~1 layer
compile: false
seed: 42

checkpoint_dir: checkpoints/transformer_tpu_medium
checkpoint_every: 500
eval_every: 500
log_every: 50
max_eval_batches: 20
early_stop_patience: 20
early_stop_min_delta: 0.01
