# Transformer TPU chat — resume config for subsequent sessions
# Lower LR, short warmup, reset optimizer.
model_type: transformer
vocab_size: 16384
d_model: 768
n_layers: 12
n_heads: 12
seq_len: 1024

dataset_type: chat
instruction_data: ""
train_path: ""
val_path: ""
tokenizer_path: ""

batch_size: 32
grad_accum_steps: 1
num_workers: 4
lr: 4.0e-5
weight_decay: 0.05
max_steps: 5000
warmup_steps: 100
reset_optimizer: true
grad_clip: 1.0
grad_checkpoint: true  # recompute attention in backward — bounds HBM to ~1 layer
compile: false
tpu_cores: 1  # PINNED SINGLE-CORE, and this is NOT a change in behaviour: tpu_cores was not a
#               TrainConfig field until now, so it was dropped on load and this run has
#               ALWAYS trained on one core (tpu_cores: 0 in this file never took effect). Letting it
#               fan out now would multiply the effective batch by 8 mid-lineage (32 -> 256)
#               at the same LR, and make every step in the budget worth 8x more data. To go
#               multi-core deliberately: divide batch_size by 8 first (-> 4 per core),
#               then re-derive the step budget in run_config.py.
seed: 42

checkpoint_dir: checkpoints/transformer_tpu_chat
checkpoint_every: 500
eval_every: 250
log_every: 50
max_eval_batches: 20
early_stop_patience: 3
early_stop_min_delta: 0.01
