# Instruction tuning config for Mamba 47M
# Starts from the pretrained medium checkpoint and fine-tunes on instruction data

model_type: mamba
vocab_size: 4096
d_model: 768
n_layers: 12
d_state: 16
d_conv: 4
expand: 2
seq_len: 512

batch_size: 2
grad_accum_steps: 4
lr: 5.0e-5
weight_decay: 0.01
max_steps: 2000
warmup_steps: 100
grad_clip: 1.0
seed: 42

checkpoint_dir: /app/data/checkpoints/mamba_instruct
checkpoint_every: 200
eval_every: 100
log_every: 25

# Pretrained checkpoint to start from
pretrain_checkpoint: /app/data/checkpoints/mamba_medium/latest.pt

# Instruction data
instruction_data: /app/llm_lab/data/instruction_seed.json
tokenizer_path: /app/data/tokenizer.json

# These are not used in instruction tuning but needed by config
train_path: /app/data/splits/train.txt
val_path: /app/data/splits/val.txt
