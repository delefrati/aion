# Transformer medium — SINGLE-CORE TPU fallback for Kaggle v5e-8.
# Use this if the multi-core xmp.spawn keeps crashing (BrokenProcessPool). It runs on
# one TPU core (no spawn, fully reliable) but keeps the same effective batch (64) via
# gradient accumulation, so training dynamics match transformer_tpu_medium.yaml.
# Slower wall-clock per step, but it won't crash. Same checkpoint_dir -> resumes the
# same run.
model_type: transformer
vocab_size: 16384
d_model: 768
n_layers: 12
n_heads: 12
seq_len: 1024
dropout: 0.1

dataset_type: text
train_path: ""
val_path: ""
tokenizer_path: ""
instruction_data: ""

# Single core: replace the 8x data-parallel with 8x gradient accumulation so the
# effective batch stays 8 * 8 * 1 = 64 (same as the multi-core config).
batch_size: 8
grad_accum_steps: 8
tpu_cores: 1
num_workers: 4
lr: 3.0e-4
weight_decay: 0.01
max_steps: 20000
warmup_steps: 500
lr_decay_steps: 20000  # cosine decays over the full target, not per-session max_steps
grad_clip: 1.0
grad_checkpoint: true  # recompute attention in backward — bounds HBM to ~1 layer
compile: false
seed: 42

checkpoint_dir: checkpoints/transformer_tpu_medium
checkpoint_every: 500
eval_every: 500
log_every: 50
max_eval_batches: 20
early_stop_patience: 20
early_stop_min_delta: 0.01
