[project]
name = "aion-llm-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "bitsandbytes>=0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_lab*"]
